<!DOCTYPE html>
<html>

<head>
    <title>Add Passenger Details</title>
    <link rel="stylesheet" href="add-passenger.css">
</head>

<body>

    <header>
        <h1>Railway / Bus Reservation</h1>
        <p>Add Passenger Details</p>
    </header>

    <div class="container">

        <h2>Passenger Information</h2>

        <form>

            <label>Passenger Name</label>
            <input type="text" placeholder="Enter passenger name">

            <label>Age</label>
            <input type="number" placeholder="Enter age">

            <label>Gender</label>
            <select>
                <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Transport Type</label>
            <select>
                <option>Railway</option>
                <option>Bus</option>
            </select>

            <label>Source</label>
            <input type="text" placeholder="Enter source">

            <label>Destination</label>
            <input type="text" placeholder="Enter destination">

            <button type="button">Add Passenger</button>

            <a href="index.html">Back to Home</a>

        </form>

    </div>

    <footer>
        <p>Data Structure Project | FIFO Queue</p>
    </footer>

</body>

</html>
